name: High Quality Reference

on:
  workflow_dispatch:
    inputs:
      spp:
        description: "Reference SPP"
        required: true
        default: "1024"
        type: choice
        options:
          - "1024"
          - "2048"
      samples_per_pass:
        description: "Samples per pass"
        required: true
        default: "8"
        type: choice
        options:
          - "4"
          - "8"
          - "16"

jobs:
  reference-render:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure CPU renderer
        run: |
          cmake -S . -B build \
            -DRENDER_ENABLE_CUDA=OFF \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j2

      - name: Render high quality reference
        run: |
          set -euo pipefail
          mkdir -p reference
          ./build/render_cpu \
            "${{ inputs.spp }}" \
            "${{ inputs.samples_per_pass }}" \
            16 owen tent | tee reference/render.log

          python3 scripts/ppm_to_png.py \
            --output-dir reference \
            cornell_cpu_raw.ppm \
            cornell_cpu_diffuse.ppm \
            cornell_cpu_specular.ppm \
            cornell_cpu_final.ppm

          for signal in raw diffuse specular final; do
            cp "cornell_cpu_${signal}.pfm" \
              "reference/cornell_cpu_${signal}.pfm"
          done

      - name: Verify reference outputs
        run: |
          set -euo pipefail
          for signal in raw diffuse specular final; do
            test -s "reference/cornell_cpu_${signal}.pfm"
            test -s "reference/cornell_cpu_${signal}.png"
          done

      - name: Upload reference
        uses: actions/upload-artifact@v4
        with:
          name: "linear-hdr-reference-${{ inputs.spp }}spp"
          path: reference/
          if-no-files-found: error
          retention-days: 90
