name: Render Validation

on:
  push:
    branches: [ main ]
    paths:
      - "Core/**"
      - "Backend/**"
      - "CMakeLists.txt"
      - "scripts/ppm_to_png.py"
      - "scripts/render_metrics.py"
      - "scripts/render_metrics.py"
      - ".github/workflows/render-preview.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "Core/**"
      - "Backend/**"
      - "CMakeLists.txt"
      - "scripts/ppm_to_png.py"
      - ".github/workflows/render-preview.yml"
  workflow_dispatch:

jobs:
  render-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure CPU renderer
        run: |
          cmake -S . -B build \
            -DRENDER_ENABLE_CUDA=OFF \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j2

      - name: Render 16 / 64 / 256 SPP validation set
        run: |
          set -euo pipefail
          mkdir -p validation
          for spp in 16 64 256; do
            echo "=== Rendering ${spp} SPP ==="
            mkdir -p "validation/${spp}spp"
            ./build/render_cpu "${spp}" 8 16 | tee "validation/${spp}spp/render.log"
            python3 scripts/ppm_to_png.py \
              --output-dir "validation/${spp}spp" \
              cornell_cpu_raw.ppm \
              cornell_cpu_diffuse.ppm \
              cornell_cpu_specular.ppm \
              cornell_cpu_final.ppm

            for signal in raw diffuse specular final; do
              cp "cornell_cpu_${signal}.pfm" \
                "validation/${spp}spp/cornell_cpu_${signal}.pfm"
            done
          done

      - name: Compute Linear HDR quality metrics
        run: |
          python3 scripts/render_metrics.py \
            --validation-dir validation \
            --spp 16 64 256 \
            --reference-spp 256 \
            --check-convergence \
            --check-denoising \
            --output validation/metrics.json
          cat validation/metrics.json

      - name: Verify adaptive strength responds to SPP
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          def first_strength(spp, signal):
              text = Path(f"validation/{spp}spp/render.log").read_text()
              match = re.search(
                  rf"Adaptive A-Trous iteration 0 step=1 .*?{signal}Strength=([0-9.eE+-]+)",
                  text,
              )
              if not match:
                  raise SystemExit(f"missing {signal} adaptive strength for {spp} SPP")
              return float(match.group(1))

          d16 = first_strength(16, "diffuse")
          d256 = first_strength(256, "diffuse")
          s16 = first_strength(16, "specular")
          s256 = first_strength(256, "specular")

          print(f"diffuse: 16={d16:.6f}, 256={d256:.6f}")
          print(f"specular: 16={s16:.6f}, 256={s256:.6f}")

          if not d16 > d256:
              raise SystemExit("diffuse adaptive strength did not decrease with SPP")
          if not s16 > s256:
              raise SystemExit("specular adaptive strength did not decrease with SPP")
          PY

      - name: Verify validation PNGs
        run: |
          set -euo pipefail
          for spp in 16 64 256; do
            for signal in raw diffuse specular final; do
              test -s "validation/${spp}spp/cornell_cpu_${signal}.png"
              test -s "validation/${spp}spp/cornell_cpu_${signal}.pfm"
            done
          done
          test -s validation/metrics.json
          find validation -type f \( -name "*.png" -o -name "*.pfm" -o -name "metrics.json" \) -print

      - name: Upload render validation
        uses: actions/upload-artifact@v4
        with:
          name: render-validation
          path: validation/
          if-no-files-found: error
          retention-days: 30
