name: Render Validation

on:
  push:
    branches: [ main ]
    paths:
      - "Core/**"
      - "Backend/**"
      - "CMakeLists.txt"
      - ".github/workflows/render-preview.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "Core/**"
      - "Backend/**"
      - "CMakeLists.txt"
      - ".github/workflows/render-preview.yml"
  workflow_dispatch:

jobs:
  render-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure CPU renderer
        run: |
          cmake -S . -B build \
            -DRENDER_ENABLE_CUDA=OFF \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j2

      - name: Install PNG converter
        run: python3 -m pip install --disable-pip-version-check --quiet pillow

      - name: Render 16 / 64 / 256 SPP validation set
        run: |
          set -euo pipefail
          mkdir -p validation
          for spp in 16 64 256; do
            echo "=== Rendering ${spp} SPP ==="
            ./build/render_cpu "${spp}" 8 16
            mkdir -p "validation/${spp}spp"
            python3 - "${spp}" <<'PY'
          import sys
          from pathlib import Path
          from PIL import Image

          spp = sys.argv[1]
          out = Path("validation") / f"{spp}spp"
          for signal in ("raw", "diffuse", "specular", "final"):
              src = Path(f"cornell_cpu_{signal}.ppm")
              if not src.exists() or src.stat().st_size == 0:
                  raise SystemExit(f"missing render output: {src}")
              image = Image.open(src)
              dst = out / f"cornell_{signal}.png"
              image.save(dst, optimize=True)
              print(f"{dst}: {image.width}x{image.height}")
          PY
          done

      - name: Verify validation PNGs
        run: |
          set -euo pipefail
          for spp in 16 64 256; do
            for signal in raw diffuse specular final; do
              test -s "validation/${spp}spp/cornell_${signal}.png"
            done
          done
          find validation -type f -name "*.png" -print

      - name: Upload render validation
        uses: actions/upload-artifact@v4
        with:
          name: render-validation
          path: validation/
          if-no-files-found: error
          retention-days: 30
